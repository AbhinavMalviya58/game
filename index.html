<!DOCTYPE html>
<html>

<head>
    <title>Tap Jump Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        canvas {
            display: block;
            margin: auto;
            background: #222;
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>
    <p style="text-align:center;color:#fff;margin:10px 0;"><a href="new.html" style="color:#0ff;text-decoration:none;">Play Color Match →</a></p>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        canvas.width = 360;
        canvas.height = 600;

        let player = { x: 160, y: 500, w: 40, h: 40, dy: 0 };
        let gravity = 0.8;
        let jump = -12;
        let ground = 560;

        document.addEventListener("click", () => {
            if (player.y >= ground) player.dy = jump;
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            player.dy += gravity;
            player.y += player.dy;

            if (player.y > ground) {
                player.y = ground;
                player.dy = 0;
            }

            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>

</html>
